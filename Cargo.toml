[package]
name = "huii"
version = "0.0.1"
edition = "2024"

[dependencies]
winnow = "0.6"
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1.36", features = ["full"] }
blake3 = "1.5"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.8"
